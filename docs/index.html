<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pure Agent</title>
  <link rel="icon" href="./assets/pixel-portrait-transparent.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f7f7f8;
      color: #141516;
      text-align: center;
    }
    main { padding: 2rem; }
    img { display: block; margin-inline: auto; }
    h1 { margin: 1rem 0 1.2rem; font: 500 clamp(2.25rem, 7vw, 3.2rem)/1.15 Georgia, serif; }
    a { color: inherit; font: 0.875rem/1.5 ui-monospace, monospace; text-underline-offset: 0.25em; }
    @media (prefers-color-scheme: dark) { body { background: #0c0d0f; color: #e9eaeb; } }
  </style>
</head>
<body>
  <main>
    <img src="./assets/pixel-portrait-transparent.svg" width="76" height="76" alt="">
    <h1>Pure Agent</h1>
    <a href="https://github.com/pixelieee/pure-agent">GitHub</a>
  </main>
</body>
</html>
