<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pure Agent</title>
  <link rel="icon" href="./favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f7f7f8;
      color: #141516;
      text-align: center;
    }
    main { padding: 2rem; }
    .portraits { display: flex; justify-content: center; align-items: end; gap: 0.75rem; }
    .portraits img { display: block; }
    h1 { margin: 1rem 0 1.2rem; font: 500 clamp(2.25rem, 7vw, 3.2rem)/1.15 Georgia, serif; }
    a { color: inherit; font: 0.875rem/1.5 ui-monospace, monospace; text-underline-offset: 0.25em; }
    @media (prefers-color-scheme: dark) { body { background: #0c0d0f; color: #e9eaeb; } }
  </style>
</head>
<body>
  <main>
    <div class="portraits">
      <img
        src="./assets/pixel-portrait-mature-96.png"
        srcset="./assets/pixel-portrait-mature-96.png 1x,
                ./assets/pixel-portrait-mature-120.png 1.25x,
                ./assets/pixel-portrait-mature-144.png 1.5x,
                ./assets/pixel-portrait-mature-168.png 1.75x,
                ./assets/pixel-portrait-mature-192.png 2x,
                ./assets/pixel-portrait-mature-288.png 3x,
                ./assets/pixel-portrait-mature-384.png 4x"
        width="96" height="96" alt="Pure Agent, mature form">
      <img src="./assets/pixel-portrait-chibi.png" width="76" height="76" alt="Pure Agent, chibi form">
    </div>
    <h1>Pure Agent</h1>
    <a href="https://github.com/pixelieee/pure-agent">GitHub</a>
  </main>
</body>
</html>
