name: Linux non-model checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nonmodel:
    name: Node 24 / Linux non-model components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_registry: https://registry.npmjs.org
    steps:
      # No setup-node cache: the consumer reuses only this job's locked tarballs.
      - name: Select isolated cold npm cache
        shell: bash
        run: echo "npm_config_cache=${{ runner.temp }}/pure-agent-npm-cache-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      # Setup uses network; no model credentials or live API calls are configured.
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Static quality, types, and build (no test execution)
        run: npm run check:static
      - name: Reviewed non-model Linux component checks
        run: npm run test:nonmodel
      - name: Offline installed-package imports, types, and CLI help
        run: npm run test:package:nonmodel

  nonmodel-gate:
    # Deliberately different from the historical acceptance gate. Not API acceptance.
    name: Linux non-model checks gate
    needs: [nonmodel]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful non-model components
        if: ${{ always() }}
        shell: bash
        env:
          NONMODEL_RESULT: ${{ needs.nonmodel.result }}
        run: |
          if [[ "$NONMODEL_RESULT" != "success" ]]; then
            printf '::error::Non-model component checks must succeed; result=%s\n' "$NONMODEL_RESULT"
            exit 1
          fi
          printf 'Non-model component checks succeeded. Real API acceptance is separate and pending.\n'
