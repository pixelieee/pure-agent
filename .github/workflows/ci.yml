name: Offline acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Node 24 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A cold cache catches accidental reliance on prior registry metadata.
      npm_config_cache: ${{ runner.temp }}/pure-agent-npm-cache
      npm_config_registry: https://registry.npmjs.org
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'
      # Network is used for toolchain/dependency setup, never for live model tests.
      # npm ci caches locked tarballs; the offline consumer reuses their lock graph.
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck, offline tests, and build
        run: npm run check
      - name: Verify installed SDK and demo CLI from tarball
        run: npm run test:package
